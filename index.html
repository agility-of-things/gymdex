<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/x-icon" href="favicon3.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Gymdex</title>
<style>
  :root{
    --bg:#17181a;
    --surface:#212327;
    --surface-2:#2a2d32;
    --text:#f2f1ec;
    --text-dim:#9b9fa6;
    --line:#34373d;
    --done:#4ade80;
    --danger:#e5484d;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding-bottom:96px;
    -webkit-tap-highlight-color:transparent;
  }

  header{
    padding:8px 16px 12px;
    border-bottom:0px solid var(--line);
    position:sticky;
    top:0;
    background:var(--bg);
    z-index:5;
  }
  header h1{
    margin:0;
    font-size:22px;
    font-weight:800;
    letter-spacing:0.02em;
    text-transform:uppercase;
  }
  header p{
    margin:4px 0 0;
    color:var(--text-dim);
    font-size:13px;
  }

  main{padding:12px;}

  details.category{
    background:var(--surface);
    border-radius:10px;
    margin-bottom:10px;
    overflow:hidden;
    border-left:5px solid var(--cat-color, var(--text-dim));
  }

  details.category > summary{
    list-style:none;
    padding:14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.03em;
    font-size:15px;
    cursor:pointer;
    gap:8px;
  }
  details.category > summary::-webkit-details-marker{display:none;}
  .summary-left{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .summary-right{display:flex;align-items:center;gap:8px;flex:none;}
  .badge{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:12px;
    font-weight:600;
    color:var(--text-dim);
    background:var(--surface-2);
    padding:2px 8px;
    border-radius:20px;
  }
  .chev{
    color:var(--text-dim);
    transition:transform 0.15s ease;
    font-size:12px;
  }
  details.category[open] .chev{transform:rotate(90deg);}

  .exercise-list{
    padding:0 10px 10px;
  }
  .exercise-item{border-top:1px solid var(--line);}
  .exercise-row{
    display:flex;
    align-items:center;
    gap:8px;
    padding:10px 6px;
  }
  .exercise-row input[type="checkbox"]{
    width:22px;
    height:22px;
    flex:none;
    accent-color:var(--cat-color, var(--text));
  }
  .exercise-name{
    flex:1;
    font-size:15px;
    background:none;
    border:none;
    color:var(--text);
    text-align:left;
    padding:6px 0;
    cursor:pointer;
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .exercise-name.no-link{cursor:default;color:var(--text-dim);}
  .icon-btn{
    flex:none;
    width:32px;
    height:32px;
    border-radius:50%;
    background:var(--surface-2);
    border:none;
    color:var(--text);
    font-size:13px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
  }
  .remove-btn{
    flex:none;
    width:28px;
    height:28px;
    border-radius:50%;
    background:none;
    border:none;
    color:var(--text-dim);
    font-size:16px;
    cursor:pointer;
  }

  .inline-form{
    display:none;
    flex-direction:column;
    gap:8px;
    padding:0 6px 12px;
  }
  .inline-form.open{display:flex;}
  .inline-form input{
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:8px;
    color:var(--text);
    padding:10px;
    font-size:14px;
  }
  .inline-form .form-btns{display:flex;gap:8px;}
  .inline-form button.save{
    flex:1;
    background:var(--cat-color, var(--text));
    color:#111;
    border:none;
    border-radius:8px;
    padding:10px;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
  }
  .inline-form button.cancel{
    background:none;
    border:none;
    color:var(--text-dim);
    font-size:13px;
    padding:10px;
    cursor:pointer;
  }

  .add-row{
    padding:10px 6px 4px;
    border-top:1px solid var(--line);
  }
  .add-toggle{
    background:none;
    border:none;
    color:var(--text-dim);
    font-size:14px;
    font-weight:600;
    padding:8px 0;
    cursor:pointer;
  }
  .add-category-section{
    background:var(--surface);
    border-radius:10px;
    padding:4px 10px 10px;
    margin-bottom:10px;
    border-left:5px dashed var(--line);
  }

  .bottom-bar{
    position:fixed;
    left:0;right:0;bottom:0;
    background:var(--surface);
    border-top:1px solid var(--line);
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    z-index:10;
  }
  .count-wrap{display:flex;align-items:center;gap:10px;}
  .count-wrap span{
    color:var(--text-dim);
    font-size:13px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  .clear-btn{
    background:none;
    border:none;
    color:var(--danger);
    font-size:13px;
    font-weight:600;
    padding:4px;
    cursor:pointer;
  }
  .clear-btn:disabled{opacity:0.3;}
  .go-btn{
    background:var(--text);
    color:#111;
    border:none;
    border-radius:10px;
    padding:14px 28px;
    font-weight:800;
    font-size:15px;
    text-transform:uppercase;
    letter-spacing:0.04em;
    cursor:pointer;
  }
  .go-btn:disabled{opacity:0.35;}

  /* Session view */
  #session{display:none;}
  #session.active{display:block;}
  #catalog.hidden{display:none;}
  #add-category-wrap.hidden{display:none;}
  #backup-wrap.hidden{display:none;}

  .session-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 16px;
  }
  .session-header h2{
    margin:0;
    font-size:18px;
    text-transform:uppercase;
  }
  .back-btn{
    background:var(--surface-2);
    border:none;
    color:var(--text);
    padding:8px 14px;
    border-radius:8px;
    font-size:13px;
    cursor:pointer;
  }
  .session-item{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--surface);
    border-left:5px solid var(--cat-color, var(--text-dim));
    border-radius:10px;
    padding:14px;
    margin:0 12px 10px;
  }
  .session-item input[type="checkbox"]{width:24px;height:24px;flex:none;accent-color:var(--done);}
  .session-item .info{flex:1;min-width:0;}
  .session-item .info .name{font-size:16px;font-weight:600;}
  .session-item .info .cat{font-size:12px;color:var(--text-dim);text-transform:uppercase;}
  .session-item.done .name{text-decoration:line-through;color:var(--text-dim);}
  .empty-msg{color:var(--text-dim);text-align:center;padding:40px 20px;font-size:14px;}
</style>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">
</head>
<body>

<header>
  <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; padding:0.5rem 1rem 0.25rem; gap:0.5rem;">
    <div style="font-family:'UnifrakturCook', serif; font-size:45px; line-height:1; color:white; letter-spacing:1px;">
      Gymdex
    </div>
  </div>
  <p id="header-sub" style="text-align:center;">Weight is a number, heavy is a feeling.</p>
</header>

<main>
  <div id="catalog"></div>
  <div class="add-category-section" id="add-category-wrap">
    <button class="add-toggle" id="add-category-toggle">+ Add category</button>
    <div class="inline-form" id="add-category-form">
      <input id="new-category-name" placeholder="Category name">
      <button class="save" id="save-category-btn" style="background:var(--text);color:#111;">Save category</button>
    </div>
  </div>

  <div class="add-category-section" id="backup-wrap">
    <button class="add-toggle" id="backup-toggle">&#9881;&#65039; Backup &amp; restore</button>
    <div class="inline-form" id="backup-form">
      <div style="display:flex;gap:10px;">
        <button class="add-toggle" id="export-btn" style="flex:1;text-align:center;background:var(--surface-2);border-radius:8px;">Export backup</button>
        <button class="add-toggle" id="import-btn" style="flex:1;text-align:center;background:var(--surface-2);border-radius:8px;">Import backup</button>
      </div>
      <input type="file" id="import-file-input" accept="application/json" style="display:none;">
      <p style="color:var(--text-dim);font-size:12px;margin:8px 2px 2px;">Export saves your categories and exercises to a file you can keep in Drive, email, etc. Import replaces everything currently on this device with a backup file.</p>
    </div>
  </div>
</main>

<div id="session">
  <div class="session-header">
    <h2>Today's Session</h2>
    <button class="back-btn" id="edit-selections">Edit selections</button>
  </div>
  <div id="session-list"></div>
</div>

<div class="bottom-bar" id="bottom-bar">
  <div class="count-wrap">
    <span id="count-label">0 selected</span>
    <button class="clear-btn" id="clear-btn" disabled>Clear</button>
  </div>
  <button class="go-btn" id="go-btn" disabled>Go</button>
</div>

<script>
  // Palette derived from the user's "Magical Seaside" swatch (hue 251, S 49%, B 55%),
  // rotated across hues so every category gets a distinct, muted, dark-mode-friendly accent.
  const PALETTE = [
    "#54488C", // purple (Dusty Grape)
    "#48598C", // blue
    "#48758C", // teal-blue
    "#488C86", // teal
    "#488C6A", // green
    "#5E8C48", // yellow-green
    "#7B8C48", // yellow
    "#8C8148", // yellow-orange
    "#8C6448", // orange
    "#8C5348"  // red-orange
  ];

  const STORAGE_KEY = "gymCatalog.exercises.v1";
  const CATEGORY_KEY = "gymCatalog.categories.v2";
  const SELECTION_KEY = "gymCatalog.selections.v1";
  const SESSION_ACTIVE_KEY = "gymCatalog.sessionActive.v1";
  const DONE_KEY = "gymCatalog.done.v1";

  function randId(prefix){
    return prefix + "_" + Math.random().toString(36).slice(2, 10);
  }

  function slugify(name){
    return name.toLowerCase().trim().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "") || randId("cat");
  }

  function nextColor(existingCategories){
    return PALETTE[existingCategories.length % PALETTE.length];
  }

  function defaultCategories(){
    const names = ["Back", "Chest", "Shoulders", "Biceps", "Triceps"];
    return names.map((name, i) => ({ id: slugify(name), name, color: PALETTE[i % PALETTE.length] }));
  }

  function loadCategories(){
    try{
      const raw = localStorage.getItem(CATEGORY_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){}
    const cats = defaultCategories();
    saveCategories(cats);
    return cats;
  }

  function saveCategories(cats){
    localStorage.setItem(CATEGORY_KEY, JSON.stringify(cats));
  }

  function loadExercises(categories){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        const list = JSON.parse(raw);
        let changed = false;
        list.forEach(ex => {
          const matchById = categories.find(c => c.id === ex.category);
          if(!matchById){
            const matchByName = categories.find(c => c.name.toLowerCase() === String(ex.category).toLowerCase());
            if(matchByName){ ex.category = matchByName.id; changed = true; }
          }
        });
        if(changed) saveExercises(list);
        return list;
      }
    }catch(e){}
    const tricepsCat = categories.find(c => c.name === "Triceps");
    const seed = [
      { id: randId("ex"), category: tricepsCat ? tricepsCat.id : categories[0].id, name: "General", link: "https://youtube.com/shorts/f59wGKbXZ0w?is=6G14EanOCHCbgIQu" }
    ];
    saveExercises(seed);
    return seed;
  }

  function saveExercises(list){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
  }

  function loadSelections(){
    try{
      const raw = localStorage.getItem(SELECTION_KEY);
      if(raw) return new Set(JSON.parse(raw));
    }catch(e){}
    return new Set();
  }

  function saveSelections(set){
    localStorage.setItem(SELECTION_KEY, JSON.stringify([...set]));
  }

  function loadDone(){
    try{
      const raw = sessionStorage.getItem(DONE_KEY);
      if(raw) return new Set(JSON.parse(raw));
    }catch(e){}
    return new Set();
  }

  function saveDone(set){
    sessionStorage.setItem(DONE_KEY, JSON.stringify([...set]));
  }

  let categories = loadCategories();
  let exercises = loadExercises(categories);
  let selections = loadSelections();
  let doneIds = loadDone();

  const catalogEl = document.getElementById("catalog");
  const sessionEl = document.getElementById("session");
  const sessionListEl = document.getElementById("session-list");
  const countLabel = document.getElementById("count-label");
  const goBtn = document.getElementById("go-btn");
  const clearBtn = document.getElementById("clear-btn");
  const headerSub = document.getElementById("header-sub");
  const addCategoryWrap = document.getElementById("add-category-wrap");
  const backupWrap = document.getElementById("backup-wrap");

  function catColor(catId){
    const c = categories.find(c => c.id === catId);
    return c ? c.color : "#9b9fa6";
  }
  function catName(catId){
    const c = categories.find(c => c.id === catId);
    return c ? c.name : "Uncategorized";
  }

  function renderCatalog(){
    catalogEl.innerHTML = "";
    categories.forEach((cat) => {
      const items = exercises.filter(e => e.category === cat.id);
      const det = document.createElement("details");
      det.className = "category";
      det.style.setProperty("--cat-color", cat.color);
      det.open = false;

      const summary = document.createElement("summary");

      const summaryLeft = document.createElement("span");
      summaryLeft.className = "summary-left";
      summaryLeft.textContent = cat.name;

      const summaryRight = document.createElement("span");
      summaryRight.className = "summary-right";

      const badge = document.createElement("span");
      badge.className = "badge";
      badge.textContent = items.length;

      const editCatBtn = document.createElement("button");
      editCatBtn.className = "icon-btn";
      editCatBtn.textContent = "\u270E";
      editCatBtn.addEventListener("click", (e) => {
        e.preventDefault();
        e.stopPropagation();
        det.open = true;
        editCatForm.classList.toggle("open");
      });

      const removeCatBtn = document.createElement("button");
      removeCatBtn.className = "remove-btn";
      removeCatBtn.textContent = "\u2715";
      removeCatBtn.addEventListener("click", (e) => {
        e.preventDefault();
        e.stopPropagation();
        const msg = items.length
          ? `Delete "${cat.name}" and its ${items.length} exercise${items.length === 1 ? "" : "s"}?`
          : `Delete "${cat.name}"?`;
        if(confirm(msg)){
          categories = categories.filter(c => c.id !== cat.id);
          exercises = exercises.filter(e => e.category !== cat.id);
          items.forEach(ex => selections.delete(ex.id));
          saveCategories(categories);
          saveExercises(exercises);
          saveSelections(selections);
          renderCatalog();
          updateBottomBar();
        }
      });

      const chev = document.createElement("span");
      chev.className = "chev";
      chev.innerHTML = "&#9654;";

      summaryRight.appendChild(badge);
      summaryRight.appendChild(editCatBtn);
      summaryRight.appendChild(removeCatBtn);
      summaryRight.appendChild(chev);
      summary.appendChild(summaryLeft);
      summary.appendChild(summaryRight);
      det.appendChild(summary);

      const editCatForm = document.createElement("div");
      editCatForm.className = "inline-form";
      editCatForm.style.setProperty("--cat-color", cat.color);

      const editCatNameInput = document.createElement("input");
      editCatNameInput.value = cat.name;
      editCatNameInput.placeholder = "Category name";

      const editCatBtnRow = document.createElement("div");
      editCatBtnRow.className = "form-btns";
      const saveCatBtn = document.createElement("button");
      saveCatBtn.className = "save";
      saveCatBtn.textContent = "Save changes";
      const cancelCatBtn = document.createElement("button");
      cancelCatBtn.className = "cancel";
      cancelCatBtn.textContent = "Cancel";

      saveCatBtn.addEventListener("click", () => {
        const newName = editCatNameInput.value.trim();
        if(!newName) return;
        cat.name = newName;
        saveCategories(categories);
        renderCatalog();
      });
      cancelCatBtn.addEventListener("click", () => editCatForm.classList.remove("open"));

      editCatBtnRow.appendChild(saveCatBtn);
      editCatBtnRow.appendChild(cancelCatBtn);
      editCatForm.appendChild(editCatNameInput);
      editCatForm.appendChild(editCatBtnRow);
      det.appendChild(editCatForm);

      const listWrap = document.createElement("div");
      listWrap.className = "exercise-list";

      items.forEach(ex => {
        const itemWrap = document.createElement("div");
        itemWrap.className = "exercise-item";

        const row = document.createElement("div");
        row.className = "exercise-row";

        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = selections.has(ex.id);
        cb.addEventListener("change", () => {
          if(cb.checked) selections.add(ex.id); else selections.delete(ex.id);
          saveSelections(selections);
          updateBottomBar();
        });

        const nameBtn = document.createElement("button");
        nameBtn.className = "exercise-name" + (ex.link ? "" : " no-link");
        nameBtn.textContent = ex.name;
        if(ex.link){
          nameBtn.addEventListener("click", () => window.open(ex.link, "_blank"));
        }

        const playBtn = document.createElement("button");
        playBtn.className = "icon-btn";
        playBtn.textContent = "\u25B6";
        playBtn.style.visibility = ex.link ? "visible" : "hidden";
        playBtn.addEventListener("click", () => { if(ex.link) window.open(ex.link, "_blank"); });

        const editForm = document.createElement("div");
        editForm.className = "inline-form";
        editForm.style.setProperty("--cat-color", cat.color);

        const editBtn = document.createElement("button");
        editBtn.className = "icon-btn";
        editBtn.textContent = "\u270E";
        editBtn.addEventListener("click", () => editForm.classList.toggle("open"));

        const removeBtn = document.createElement("button");
        removeBtn.className = "remove-btn";
        removeBtn.textContent = "\u2715";
        removeBtn.addEventListener("click", () => {
          if(confirm(`Remove "${ex.name}" from ${cat.name}?`)){
            exercises = exercises.filter(e => e.id !== ex.id);
            selections.delete(ex.id);
            saveExercises(exercises);
            saveSelections(selections);
            renderCatalog();
            updateBottomBar();
          }
        });

        row.appendChild(cb);
        row.appendChild(nameBtn);
        row.appendChild(playBtn);
        row.appendChild(editBtn);
        row.appendChild(removeBtn);

        const editNameInput = document.createElement("input");
        editNameInput.value = ex.name;
        editNameInput.placeholder = "Exercise name";
        const editLinkInput = document.createElement("input");
        editLinkInput.value = ex.link || "";
        editLinkInput.placeholder = "Demo video link (optional)";
        const btnRow = document.createElement("div");
        btnRow.className = "form-btns";
        const saveEditBtn = document.createElement("button");
        saveEditBtn.className = "save";
        saveEditBtn.textContent = "Save changes";
        const cancelEditBtn = document.createElement("button");
        cancelEditBtn.className = "cancel";
        cancelEditBtn.textContent = "Cancel";

        saveEditBtn.addEventListener("click", () => {
          const newName = editNameInput.value.trim();
          if(!newName) return;
          ex.name = newName;
          ex.link = editLinkInput.value.trim();
          saveExercises(exercises);
          renderCatalog();
        });
        cancelEditBtn.addEventListener("click", () => editForm.classList.remove("open"));

        btnRow.appendChild(saveEditBtn);
        btnRow.appendChild(cancelEditBtn);
        editForm.appendChild(editNameInput);
        editForm.appendChild(editLinkInput);
        editForm.appendChild(btnRow);

        itemWrap.appendChild(row);
        itemWrap.appendChild(editForm);
        listWrap.appendChild(itemWrap);
      });

      const addRow = document.createElement("div");
      addRow.className = "add-row";
      const addToggle = document.createElement("button");
      addToggle.className = "add-toggle";
      addToggle.textContent = "+ Add exercise";
      const form = document.createElement("div");
      form.className = "inline-form";
      form.style.setProperty("--cat-color", cat.color);

      const nameInput = document.createElement("input");
      nameInput.placeholder = "Exercise name";
      const linkInput = document.createElement("input");
      linkInput.placeholder = "Demo video link (optional)";
      const saveBtn = document.createElement("button");
      saveBtn.className = "save";
      saveBtn.textContent = "Save exercise";

      addToggle.addEventListener("click", () => form.classList.toggle("open"));

      saveBtn.addEventListener("click", () => {
        const name = nameInput.value.trim();
        const link = linkInput.value.trim();
        if(!name) return;
        exercises.push({ id: randId("ex"), category: cat.id, name, link });
        saveExercises(exercises);
        nameInput.value = "";
        linkInput.value = "";
        form.classList.remove("open");
        renderCatalog();
      });

      form.appendChild(nameInput);
      form.appendChild(linkInput);
      form.appendChild(saveBtn);
      addRow.appendChild(addToggle);
      addRow.appendChild(form);
      listWrap.appendChild(addRow);

      det.appendChild(listWrap);
      catalogEl.appendChild(det);
    });
  }

  function updateBottomBar(){
    const n = selections.size;
    countLabel.textContent = `${n} selected`;
    goBtn.disabled = n === 0;
    clearBtn.disabled = n === 0;
  }

  clearBtn.addEventListener("click", () => {
    if(selections.size === 0) return;
    selections.clear();
    saveSelections(selections);
    renderCatalog();
    updateBottomBar();
  });

  document.getElementById("add-category-toggle").addEventListener("click", () => {
    document.getElementById("add-category-form").classList.toggle("open");
  });

  document.getElementById("backup-toggle").addEventListener("click", () => {
    document.getElementById("backup-form").classList.toggle("open");
  });

  document.getElementById("save-category-btn").addEventListener("click", () => {
    const input = document.getElementById("new-category-name");
    const name = input.value.trim();
    if(!name) return;
    const id = slugify(name) + (categories.some(c => c.id === slugify(name)) ? "-" + randId("") : "");
    categories.push({ id, name, color: nextColor(categories) });
    saveCategories(categories);
    input.value = "";
    document.getElementById("add-category-form").classList.remove("open");
    renderCatalog();
  });

  function renderSession(){
    sessionListEl.innerHTML = "";
    const selectedExercises = exercises.filter(e => selections.has(e.id));
    if(selectedExercises.length === 0){
      sessionListEl.innerHTML = `<div class="empty-msg">Nothing selected. Go back and pick some exercises.</div>`;
      return;
    }
    selectedExercises.forEach(ex => {
      const item = document.createElement("div");
      item.className = "session-item" + (doneIds.has(ex.id) ? " done" : "");
      item.style.setProperty("--cat-color", catColor(ex.category));

      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = doneIds.has(ex.id);
      cb.addEventListener("change", () => {
        if(cb.checked) doneIds.add(ex.id); else doneIds.delete(ex.id);
        saveDone(doneIds);
        item.classList.toggle("done", cb.checked);
      });

      const info = document.createElement("div");
      info.className = "info";
      info.innerHTML = `<div class="name"></div><div class="cat"></div>`;
      info.querySelector(".name").textContent = ex.name;
      info.querySelector(".cat").textContent = catName(ex.category);
      info.style.cursor = ex.link ? "pointer" : "default";
      if(ex.link) info.addEventListener("click", () => window.open(ex.link, "_blank"));

      const playBtn = document.createElement("button");
      playBtn.className = "icon-btn";
      playBtn.textContent = "\u25B6";
      playBtn.style.visibility = ex.link ? "visible" : "hidden";
      playBtn.addEventListener("click", (e) => { e.stopPropagation(); if(ex.link) window.open(ex.link, "_blank"); });

      item.appendChild(cb);
      item.appendChild(info);
      item.appendChild(playBtn);
      sessionListEl.appendChild(item);
    });
  }

  function enterSession(){
    document.getElementById("catalog").classList.add("hidden");
    addCategoryWrap.classList.add("hidden");
    backupWrap.classList.add("hidden");
    sessionEl.classList.add("active");
    document.getElementById("bottom-bar").style.display = "none";
    headerSub.textContent = "Today's session";
    sessionStorage.setItem(SESSION_ACTIVE_KEY, "1");
    renderSession();
  }

  function exitSession(){
    document.getElementById("catalog").classList.remove("hidden");
    addCategoryWrap.classList.remove("hidden");
    backupWrap.classList.remove("hidden");
    sessionEl.classList.remove("active");
    document.getElementById("bottom-bar").style.display = "flex";
    headerSub.textContent = "Weight is a number, heavy is a feeling.";
    sessionStorage.removeItem(SESSION_ACTIVE_KEY);
  }

  goBtn.addEventListener("click", enterSession);
  document.getElementById("edit-selections").addEventListener("click", exitSession);

  document.getElementById("export-btn").addEventListener("click", () => {
    const backup = {
      exportedAt: new Date().toISOString(),
      categories: categories,
      exercises: exercises
    };
    const blob = new Blob([JSON.stringify(backup, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    const dateStr = new Date().toISOString().slice(0,10);
    a.download = `workout-catalog-backup-${dateStr}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  });

  document.getElementById("import-btn").addEventListener("click", () => {
    document.getElementById("import-file-input").click();
  });

  document.getElementById("import-file-input").addEventListener("change", (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (evt) => {
      try{
        const data = JSON.parse(evt.target.result);
        if(!Array.isArray(data.categories) || !Array.isArray(data.exercises)){
          alert("This file doesn't look like a valid backup.");
          return;
        }
        if(!confirm(`Import this backup? It will replace everything currently on this device (${exercises.length} exercises now → ${data.exercises.length} in the backup).`)){
          return;
        }
        categories = data.categories;
        exercises = data.exercises;
        saveCategories(categories);
        saveExercises(exercises);
        selections.clear();
        saveSelections(selections);
        renderCatalog();
        updateBottomBar();
        alert("Backup imported.");
      }catch(err){
        alert("Couldn't read that file. Make sure it's a backup exported from this app.");
      }
      e.target.value = "";
    };
    reader.readAsText(file);
  });

  renderCatalog();
  updateBottomBar();
  if(sessionStorage.getItem(SESSION_ACTIVE_KEY) === "1" && selections.size > 0){
    enterSession();
  }
</script>
</body>
</html>
